server:
  port: ${PORT:8080}

spring:
  application:
    name: water-leak
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: embedded

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt-secret: ${JWT_SECRET:local-dev-secret}
